[package]
name = "vault-watch"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ZeroClaw WIT plugin: Vault watcher — proposals, balances, health"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
squads-defi-core = { version = "0.1.1", features = ["squads-state"] }
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"

[features]
default = []
squads-state = ["squads-defi-core/squads-state"]

[target.'cfg(target_family = "wasm")'.dependencies]
waki = { version = "0.5.1", features = ["json"] }

[workspace]
