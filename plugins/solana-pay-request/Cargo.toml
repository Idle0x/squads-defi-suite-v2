[package]
name = "solana-pay-request"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ZeroClaw WIT plugin: Build Solana Pay URLs for payment requests"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
squads-defi-core = { path = "../../squads-defi-core" }
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
