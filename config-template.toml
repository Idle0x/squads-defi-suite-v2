# Squads DeFi Suite — ZeroClaw Plugin Config Template
# Copy this into your ~/.zeroclaw/config.toml and replace placeholders.

# ── Prerequisites ─────────────────────────────────────────────────────────
# 1. ZeroClaw built from source with plugins-wasm,plugins-wasm-cranelift
# 2. wasm32-wasip2 target installed (rustup target add wasm32-wasip2)
# 3. plugins.auto_discover = true (enabled by default in config)
# 4. Risk profile level = "full" for initial testing:
#      zeroclaw config set risk_profiles.balanced.level full

# ── 1. solana-pay-request ──────────────────────────────────────────────
[[plugins.entries]]
name = "solana-pay-request"

[plugins.entries.solana-pay-request.config]
recipient = "YOUR_SOLANA_ADDRESS_HERE"   # Config-locked — agent cannot redirect

# ── 2. token-risk-check ─────────────────────────────────────────────────
[[plugins.entries]]
name = "token-risk-check"

[plugins.entries.token-risk-check.config]
rpc_url = "https://api.mainnet-beta.solana.com"

# ── 3. vault-watch ──────────────────────────────────────────────────────
[[plugins.entries]]
name = "vault-watch"

[plugins.entries.vault-watch.config]
rpc_url = "https://api.mainnet-beta.solana.com"
squads_vault = "YOUR_SQUADS_VAULT_ADDRESS_HERE"

# ── 4. jupiter-swap-propose ─────────────────────────────────────────────
[[plugins.entries]]
name = "jupiter-swap-propose"

[plugins.entries.jupiter-swap-propose.config]
rpc_url = "https://api.mainnet-beta.solana.com"
squads_vault = "YOUR_SQUADS_VAULT_ADDRESS"
creator = "YOUR_AUTHORITY_PUBKEY"
mint_allowlist = "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"
# Optional overrides (defaults shown):
# jupiter_url = "https://api.jup.ag"
